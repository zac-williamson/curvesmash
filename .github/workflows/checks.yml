name: Evaluator checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked organizer dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Pull immutable organizer test image
        run: docker pull python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      - name: Verify acceptance, review and isolation failure paths
        env:
          CURVESMASH_TEST_IMAGE: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: python -m unittest discover -s tests -v
      - name: Check closed prelaunch manifest
        run: bash .yukon/setup.sh
