name: secp256k1-ecdlp
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: curvesmash-secp256k1-ecdlp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/qualification.yml
    with:
      track: secp256k1-ecdlp
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CURVESMASH_REVIEW_SIGNING_KEYS: ${{ secrets.CURVESMASH_REVIEW_SIGNING_KEYS }}
